[package]
name = "rajutara-mcp"
version = "1.5.1"
edition = "2024"
rust-version = "1.95"
description = "MCP server (stdio) exposing rajutara checks: file smoke test, DXF import summary, nesting, plotting."
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: never adopted by a parent directory's workspace.
[workspace]

# The rajutara checkout sits next to this repo: ../rajutara. Edit the paths if it lives elsewhere.
[dependencies]
rajutara-core = { path = "../../rajutara/crates/rajutara-core" }
rajutara-io = { path = "../../rajutara/crates/rajutara-io" }
rajutara-nest = { path = "../../rajutara/crates/rajutara-nest" }
rajutara-ui = { path = "../../rajutara/crates/rajutara-ui" }
rmcp = { version = "3.8", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
panic = "unwind"
